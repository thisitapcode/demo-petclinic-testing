- pipeline: testing
  name: Testing
  refs:
  - refs/heads/main
  events:
  - type: WEBHOOK
  actions:
  - action: ./mvnw clean package
    type: BUILD
    docker_image_name: library/maven
    docker_image_tag: 3-eclipse-temurin-17  # <-- ĐỔI THÀNH CÁI NÀY
    execute_commands:
    - ./mvnw clean package
    cached_dirs:
    - /root/.m2/repository
    shell: BASH
