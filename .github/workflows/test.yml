# Tên của workflow
name: Java CI (Test PetClinic)

# Khi nào thì chạy: Kích hoạt mỗi khi PUSH
on: [push]

# Các "việc" cần làm
jobs:
  build:
    # Chạy trên một máy ảo Ubuntu (do GitHub cung cấp)
    runs-on: ubuntu-latest

    # Các bước chạy
    steps:
    # Bước 1: Kéo code của bro về
    - name: Kéo code về
      uses: actions/checkout@v4

    # Bước 2: "THẦN THÁNH" - Cài đặt đúng JAVA 17
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'     
        java-version: '17' # BÁO RÕ LÀ DÙNG JAVA 17

    # Bước 3: Chạy test
    - name: Chạy test bằng Maven
      run: ./mvnw clean package